name: Profile metadata helper safety checks

on:
  push:
    branches: [main]
    paths:
      - tools/finish_github_settings.py
      - .github/workflows/profile-metadata-check.yml
  pull_request:
    paths:
      - tools/finish_github_settings.py
      - .github/workflows/profile-metadata-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-helper-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Compile retired helper
        run: python -m py_compile tools/finish_github_settings.py
      - name: Verify default is read-only
        run: |
          python tools/finish_github_settings.py > /tmp/profile-settings-preview.txt
          grep -q 'READ-ONLY' /tmp/profile-settings-preview.txt
          grep -q 'Homepage updates remain on hold' /tmp/profile-settings-preview.txt
      - name: Refuse legacy --apply without invoking GitHub
        run: |
          if python tools/finish_github_settings.py --apply > /tmp/legacy-apply-out.txt 2> /tmp/legacy-apply-err.txt; then
            echo 'ERROR: unsafe legacy --apply unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'REFUSED' /tmp/legacy-apply-err.txt
          grep -q 'No GitHub settings were changed' /tmp/legacy-apply-err.txt
